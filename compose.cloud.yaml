name: pattyops-cloud

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ${PATTYOPS_CLOUD_ENV_FILE:-.env.cloud}
    volumes:
      - pattyops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - pattyops-cloud

  cloud-api:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    env_file:
      - ${PATTYOPS_CLOUD_ENV_FILE:-.env.cloud}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PATTYOPS_CLOUD_BIND_ADDRESS:-127.0.0.1}:${PATTYOPS_CLOUD_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - pattyops-cloud

volumes:
  pattyops-postgres:

networks:
  pattyops-cloud:
    name: pattyops-cloud
