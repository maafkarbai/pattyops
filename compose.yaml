name: pattyops

services:
  pattyops:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - run
      - --model
      - /app/models/${PATTYOPS_MODEL_FILE:-best.pt}
      - --source
      - /app/input/${PATTYOPS_VIDEO_FILE:-Patty3.mp4}
      - --db
      - /app/data/${PATTYOPS_DATABASE_FILE:-pattyops.db}
      - --save-video
      - /app/output/${PATTYOPS_OUTPUT_FILE:-pattyops_output.mp4}
      - --tracker
      - ${PATTYOPS_TRACKER:-botsort.yaml}
      - --confidence
      - ${PATTYOPS_CONFIDENCE:-0.35}
      - --iou
      - ${PATTYOPS_IOU:-0.5}
    volumes:
      - ./input:/app/input:ro
      - ./Database:/app/data
      - ./models:/app/models:ro
      - ./output:/app/output
    restart: "no"
